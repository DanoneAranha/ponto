<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6A9F">
<title>AGI · Ponto</title>
<style>
:root{--bg:#EEF1F5;--card:#fff;--borda:#D5DBE3;--txt:#1F2933;--sub:#66727F;--topo:#2D6A9F;--ok:#2B8A3E;--erro:#C92A2A;--aviso:#B26A00;--chip:#E8ECF1}
@media (prefers-color-scheme:dark){:root{--bg:#16191D;--card:#20252B;--borda:#333A43;--txt:#E6EAEE;--sub:#9AA5B1;--topo:#2D6A9F;--ok:#51CF66;--erro:#FF6B6B;--aviso:#FFB454;--chip:#333A43}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:16px;min-height:100vh}
header{background:var(--topo);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:18px;margin:0;font-weight:700}
header small{display:block;opacity:.85;font-weight:400;font-size:12px}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:16px;margin-bottom:14px}
.relogio{text-align:center}
.relogio .hora{font-size:48px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.relogio .data{color:var(--sub)}
.relogio .data::first-letter{text-transform:uppercase}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button.bt{border:1px solid var(--borda);background:var(--card);color:var(--txt);border-radius:12px;padding:16px 8px;font-size:16px;font-weight:600;min-height:72px}
button.bt small{display:block;font-weight:400;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
button.bt.prox{background:var(--topo);border-color:var(--topo);color:#fff}
button.bt.prox small{color:#fff;opacity:.9}
button.bt.feito{background:var(--chip);color:var(--sub)}
button.bt.feito small{color:var(--ok);font-weight:600}
button:disabled{opacity:.6}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input[type=email],input[type=password],input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid var(--borda);border-radius:8px;background:var(--card);color:var(--txt);font-size:16px}
button.pri{width:100%;background:var(--topo);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;margin-top:14px}
button.sec{width:100%;background:var(--chip);color:var(--txt);border:0;border-radius:10px;padding:13px;font-size:15px;margin-top:8px;text-align:left}
.msg{margin-top:10px;font-size:14px}.erro{color:var(--erro)}.ok{color:var(--ok)}.aviso{color:var(--aviso)}
ul.lista{list-style:none;margin:0;padding:0}
ul.lista li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--borda);font-size:15px}
ul.lista li:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);white-space:nowrap}
.tag.just{background:rgba(178,106,0,.18);color:var(--aviso)}
.tag.ok{background:rgba(43,138,62,.16);color:var(--ok)}
h2{font-size:15px;margin:0 0 8px}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.folha{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--borda);background:var(--chip);color:var(--txt);border-radius:999px;padding:9px 14px;font-size:15px}
.chip.sel{background:var(--topo);color:#fff;border-color:var(--topo)}
.foto{max-width:100%;border-radius:10px;margin-top:10px;display:block}
.demo{background:var(--aviso);color:#fff;text-align:center;font-size:13px;padding:4px}
.oculto{display:none!important}
</style>
</head>
<body>
<div id="demo" class="demo oculto">MODO DEMONSTRAÇÃO · nada é gravado</div>
<header>
  <h1>AGI · Ponto<small id="quem"></small></h1>
  <button id="sair" class="oculto">Sair</button>
</header>
<main>
  <!-- login -->
  <section id="telaLogin" class="card oculto">
    <h2>Entrar</h2>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button id="entrar" class="pri">Entrar</button>
    <div id="msgLogin" class="msg erro"></div>
  </section>

  <!-- ponto -->
  <section id="telaPonto" class="oculto">
    <div class="card relogio">
      <div class="hora" id="hora">--:--:--</div>
      <div class="data" id="data"></div>
      <div class="grade" id="botoes"></div>
      <div id="msgPonto" class="msg"></div>
    </div>
    <div class="card">
      <h2>Hoje</h2>
      <ul class="lista" id="lista"></ul>
      <div id="vazio" class="msg" style="color:var(--sub)">Nenhuma batida ainda.</div>
    </div>
    <div class="card oculto" id="admin">
      <h2>Local do escritório</h2>
      <div id="localAtual" class="msg" style="margin:0 0 8px;color:var(--sub)"></div>
      <label for="raio">Raio permitido (metros)</label>
      <input id="raio" type="number" min="30" max="1000" value="150">
      <button id="cadLocal" class="sec">📍 Cadastrar este local (estou no escritório agora)</button>
      <div id="msgAdmin" class="msg"></div>
    </div>
  </section>
</main>

<div id="fundo" class="fundo oculto"><div class="folha" id="folha"></div></div>

<script type="module">
/* ============ CONFIGURAÇÃO ============ */
// Cole aqui a configuração web do Firebase (Console > Configurações do projeto > Seus apps > Web).
// Essa chave é pública (não é segredo); quem protege os dados são as regras do Firestore.
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "agi-apps-4935a.firebaseapp.com",
  projectId: "agi-apps-4935a",
  appId: "COLE_AQUI",
};
const FUSO = "America/Sao_Paulo";
const TIPOS = [["entrada", "Entrada"], ["saida_almoco", "Saída almoço"], ["volta_almoco", "Volta almoço"], ["saida", "Saída"]];
const MOTIVOS = ["Home Office", "Vistorias", "Viagem"];
const PRECISAO_MAX = 150;   // metros: acima disso o sinal de GPS é fraco demais para validar
const RAIO_PADRAO = 150;

const DEMO = new URLSearchParams(location.search).has("demo");
const $ = (id) => document.getElementById(id);
const fmtHora = (d) => d.toLocaleTimeString("pt-BR", { timeZone: FUSO, hour: "2-digit", minute: "2-digit" });
const chaveDia = (d) => d.toLocaleDateString("sv-SE", { timeZone: FUSO });   // AAAA-MM-DD no fuso de SP

/* ============ LÓGICA PURA ============ */
function distanciaM(a, b) {
  const R = 6371000, rad = (x) => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function avaliarLocal(pos, escritorio) {
  // pos: {lat,lng,precisao}; escritorio: {lat,lng,raio}
  const dist = distanciaM(pos, escritorio);
  if (pos.precisao > PRECISAO_MAX) return { ok: false, motivo: "fraco", dist };
  // vale se o círculo de incerteza do GPS encosta no raio permitido
  return { ok: dist - pos.precisao <= escritorio.raio, motivo: "longe", dist };
}
const fmtDist = (m) => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;

/* ============ BACKEND ============ */
async function criarBackendReal() {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app), db = F.getFirestore(app);
  const col = (uid) => F.collection(db, "ponto", uid, "batidas");
  return {
    onUser: (cb) => A.onAuthStateChanged(auth, cb),
    login: (e, s) => A.signInWithEmailAndPassword(auth, e, s),
    logout: () => A.signOut(auth),
    async perfil(uid) { const s = await F.getDoc(F.doc(db, "usuarios", uid)); return s.exists() ? s.data() : null; },
    async config() { const s = await F.getDoc(F.doc(db, "config", "ponto")); return s.exists() ? s.data() : null; },
    salvarConfig: (c) => F.setDoc(F.doc(db, "config", "ponto"), c),
    async recentes(uid) {
      const q = F.query(col(uid), F.orderBy("criado_em", "desc"), F.limit(40));
      return (await F.getDocs(q)).docs.map((d) => ({ id: d.id, ...d.data(), criado_em: d.data().criado_em?.toDate?.() }));
    },
    async bater(uid, dados) {
      const ref = await F.addDoc(col(uid), { ...dados, uid, criado_em: F.serverTimestamp() });
      const s = await F.getDoc(ref);                       // devolve o horário gravado pelo servidor
      return { id: ref.id, ...s.data(), criado_em: s.data().criado_em.toDate() };
    },
  };
}
function criarBackendDemo() {
  let usuario = null, cfg = { lat: -23.6, lng: -46.7, raio: 150 }, batidas = [], ouvinte = null;
  return {
    onUser: (cb) => { ouvinte = cb; setTimeout(() => cb(usuario), 0); },
    login: async () => { usuario = { uid: "demo", email: "demo@agi" }; ouvinte(usuario); },
    logout: async () => { usuario = null; ouvinte(null); },
    perfil: async () => ({ nome: "Usuário Demo", area: "TI", status: "aprovado" }),
    config: async () => cfg,
    salvarConfig: async (c) => { cfg = c; },
    recentes: async () => [...batidas].reverse(),
    bater: async (uid, d) => { const b = { id: String(batidas.length), ...d, criado_em: new Date() }; batidas.push(b); return b; },
    _batidas: () => batidas,
  };
}

/* ============ APP ============ */
let B, usuario = null, perfil = null, escritorio = null, hojeLista = [];

function mostrar(tela) {
  $("telaLogin").classList.toggle("oculto", tela !== "login");
  $("telaPonto").classList.toggle("oculto", tela !== "ponto");
  $("sair").classList.toggle("oculto", tela !== "ponto");
}
function tick() {
  const d = new Date();
  $("hora").textContent = d.toLocaleTimeString("pt-BR", { timeZone: FUSO });
  $("data").textContent = d.toLocaleDateString("pt-BR", { timeZone: FUSO, weekday: "long", day: "2-digit", month: "long" });
}
setInterval(tick, 1000); tick();

async function carregar() {
  const todas = await B.recentes(usuario.uid);
  const hoje = chaveDia(new Date());
  hojeLista = todas.filter((b) => b.criado_em && chaveDia(b.criado_em) === hoje)
                   .sort((a, b) => a.criado_em - b.criado_em);
  desenhar();
}
function desenhar() {
  const feitos = Object.fromEntries(hojeLista.map((b) => [b.tipo, b]));
  const prox = TIPOS.find(([k]) => !feitos[k])?.[0];
  $("botoes").innerHTML = "";
  for (const [k, nome] of TIPOS) {
    const b = document.createElement("button");
    b.className = "bt" + (feitos[k] ? " feito" : k === prox ? " prox" : "");
    b.disabled = !!feitos[k];
    b.innerHTML = `${nome}<small>${feitos[k] ? "✓ " + fmtHora(feitos[k].criado_em) : (k === prox ? "toque para registrar" : "")}</small>`;
    b.onclick = () => abrirFolha(k);
    $("botoes").appendChild(b);
  }
  const ul = $("lista"); ul.innerHTML = "";
  for (const b of hojeLista) {
    const li = document.createElement("li");
    const nome = TIPOS.find(([k]) => k === b.tipo)?.[1] || b.tipo;
    const esq = document.createElement("span"); esq.textContent = `${fmtHora(b.criado_em)} · ${nome}`;
    const tag = document.createElement("span");
    tag.className = "tag " + (b.metodo === "justificativa" ? "just" : "ok");
    tag.textContent = b.metodo === "gps" ? "📍 local" : b.metodo === "foto" ? "📷 foto" : (b.justificativa || "justificado");
    li.append(esq, tag); ul.appendChild(li);
  }
  $("vazio").classList.toggle("oculto", hojeLista.length > 0);
  $("localAtual").textContent = escritorio
    ? `Cadastrado: ${escritorio.lat.toFixed(5)}, ${escritorio.lng.toFixed(5)} · raio ${escritorio.raio} m`
    : "Nenhum local cadastrado ainda: o GPS não consegue validar até alguém cadastrar.";
}

/* ---- folha de confirmação ---- */
let S = null;   // {tipo, metodo, gps, avaliacao, foto, motivo, texto, msg, ocupado}
function abrirFolha(tipo) { S = { tipo, metodo: null, gps: null, aval: null, foto: null, motivo: "", texto: "", msg: "", ocupado: false }; renderFolha(); $("fundo").classList.remove("oculto"); }
function fecharFolha() { S = null; $("fundo").classList.add("oculto"); }
$("fundo").addEventListener("click", (e) => { if (e.target === $("fundo") && !S?.ocupado) fecharFolha(); });

function podeConfirmar() {
  if (!S) return false;
  if (S.metodo === "gps") return !!S.aval?.ok;
  if (S.metodo === "foto") return !!S.foto;
  if (S.metodo === "justificativa") return !!(S.motivo === "Outro" ? S.texto.trim() : S.motivo);
  return false;
}
function renderFolha() {
  const nome = TIPOS.find(([k]) => k === S.tipo)[1];
  const f = $("folha"); f.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = `Registrar: ${nome}`; f.appendChild(h);
  const add = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); kids.forEach((k) => e.append(k)); f.appendChild(e); return e; };
  const sec = (txt, fn) => add("button", { className: "sec", textContent: txt, onclick: fn, disabled: S.ocupado });

  if (!S.metodo) {
    add("div", { className: "msg", style: "margin:0 0 6px;color:var(--sub)", textContent: "Como você quer confirmar?" });
    sec("📍 Usar minha localização", usarGps);
    sec("📷 Foto da entrada do escritório", () => { $("arqFoto").click(); });
    sec("✍️ Outro motivo (Home Office, Vistoria…)", () => { S.metodo = "justificativa"; renderFolha(); });
    sec("Cancelar", fecharFolha);
  } else {
    if (S.metodo === "gps") {
      const a = S.aval;
      if (!a) add("div", { className: "msg", textContent: "Pegando sua localização…" });
      else if (a.ok) add("div", { className: "msg ok", textContent: `✓ Você está no escritório (a ${fmtDist(a.dist)} do ponto cadastrado).` });
      else add("div", { className: "msg erro", textContent: a.motivo === "fraco"
        ? `Sinal de GPS fraco (±${Math.round(S.gps.precisao)} m). Vá para perto de uma janela e tente de novo, ou use outra opção.`
        : `Você está a ${fmtDist(a.dist)} do escritório, fora do raio permitido.` });
    }
    if (S.metodo === "foto" && S.foto) {
      add("div", { className: "msg ok", textContent: "✓ Foto anexada." });
      add("img", { className: "foto", src: S.foto, alt: "Foto da entrada" });
    }
    if (S.metodo === "justificativa") {
      add("label", { textContent: "Motivo" });
      const chips = add("div", { className: "chips" });
      for (const m of [...MOTIVOS, "Outro"]) {
        chips.appendChild(Object.assign(document.createElement("button"), {
          className: "chip" + (S.motivo === m ? " sel" : ""), textContent: m,
          onclick: () => { S.motivo = m; renderFolha(); } }));
      }
      if (S.motivo === "Outro") {
        const t = add("input", { type: "text", placeholder: "Descreva o motivo", value: S.texto, maxLength: 120 });
        t.oninput = () => { S.texto = t.value; $("confirmar").disabled = !podeConfirmar(); };
      }
    }
    if (S.msg) add("div", { className: "msg erro", textContent: S.msg });
    const c = add("button", { id: "confirmar", className: "pri", textContent: S.ocupado ? "Gravando…" : "Confirmar batida", disabled: !podeConfirmar() || S.ocupado, onclick: confirmar });
    if (S.metodo !== "gps" || S.aval) {
      sec("← Escolher outra forma", () => { S.metodo = null; S.aval = null; S.gps = null; S.msg = ""; renderFolha(); });
    }
    if (S.metodo === "gps" && S.aval && !S.aval.ok) sec("Tentar o GPS de novo", usarGps);
    c.disabled = !podeConfirmar() || S.ocupado;
  }
}

function usarGps() {
  S.metodo = "gps"; S.aval = null; S.gps = null; S.msg = ""; renderFolha();
  if (!escritorio) { S.aval = { ok: false, motivo: "semlocal", dist: 0 }; S.msg = "O local do escritório ainda não foi cadastrado. Use foto ou outro motivo."; renderFolha(); return; }
  if (!navigator.geolocation) { S.aval = { ok: false, motivo: "fraco", dist: 0 }; S.gps = { precisao: 9999 }; S.msg = "Este aparelho não oferece localização."; renderFolha(); return; }
  navigator.geolocation.getCurrentPosition((p) => {
    S.gps = { lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy };
    S.aval = avaliarLocal(S.gps, escritorio); renderFolha();
  }, (e) => {
    S.gps = { precisao: 9999 }; S.aval = { ok: false, motivo: "fraco", dist: 0 };
    S.msg = e.code === 1 ? "Localização bloqueada. Libere a permissão do site no navegador ou use outra opção." : "Não consegui pegar a localização. Tente de novo.";
    renderFolha();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// foto: reduz e guarda dentro do próprio registro (não precisa de Storage)
const inputFoto = Object.assign(document.createElement("input"), { id: "arqFoto", type: "file", accept: "image/*", hidden: true });
inputFoto.setAttribute("capture", "environment");
document.body.appendChild(inputFoto);
inputFoto.onchange = async () => {
  const arq = inputFoto.files[0]; inputFoto.value = "";
  if (!arq || !S) return;
  try {
    const img = await createImageBitmap(arq);
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const cv = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    S.foto = cv.toDataURL("image/jpeg", 0.6); S.metodo = "foto"; S.msg = "";
  } catch { S.metodo = "foto"; S.foto = null; S.msg = "Não consegui ler a foto. Tente de novo."; }
  renderFolha();
};

async function confirmar() {
  if (!podeConfirmar()) return;
  S.ocupado = true; S.msg = ""; renderFolha();
  const d = { tipo: S.tipo, metodo: S.metodo, hora_cliente: new Date().toISOString() };
  if (S.gps && S.gps.lat != null) Object.assign(d, { lat: S.gps.lat, lng: S.gps.lng, precisao: Math.round(S.gps.precisao), distancia: Math.round(S.aval.dist) });
  if (S.metodo === "foto") d.foto = S.foto;
  if (S.metodo === "justificativa") d.justificativa = (S.motivo === "Outro" ? S.texto.trim() : S.motivo).slice(0, 120);
  d.nome = perfil?.nome || usuario.email;
  try {
    await B.bater(usuario.uid, d);
    const nome = TIPOS.find(([k]) => k === S.tipo)[1];
    fecharFolha(); await carregar();
    $("msgPonto").className = "msg ok"; $("msgPonto").textContent = `✓ ${nome} registrada.`;
    setTimeout(() => { $("msgPonto").textContent = ""; }, 5000);
  } catch (e) {
    S.ocupado = false; S.msg = "Não consegui gravar (sem internet ou sem permissão). Tente de novo."; renderFolha();
  }
}

/* ---- admin: cadastrar local ---- */
$("cadLocal").onclick = () => {
  $("msgAdmin").className = "msg"; $("msgAdmin").textContent = "Pegando localização…";
  navigator.geolocation.getCurrentPosition(async (p) => {
    if (p.coords.accuracy > PRECISAO_MAX) { $("msgAdmin").className = "msg erro"; $("msgAdmin").textContent = `Sinal fraco (±${Math.round(p.coords.accuracy)} m). Tente perto de uma janela.`; return; }
    const c = { lat: p.coords.latitude, lng: p.coords.longitude, raio: Math.max(30, Math.min(1000, +$("raio").value || RAIO_PADRAO)), nome: "Escritório" };
    try { await B.salvarConfig(c); escritorio = c; desenhar(); $("msgAdmin").className = "msg ok"; $("msgAdmin").textContent = "✓ Local cadastrado."; }
    catch { $("msgAdmin").className = "msg erro"; $("msgAdmin").textContent = "Sem permissão para cadastrar o local."; }
  }, () => { $("msgAdmin").className = "msg erro"; $("msgAdmin").textContent = "Localização bloqueada no navegador."; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};

/* ---- login ---- */
$("entrar").onclick = async () => {
  $("msgLogin").textContent = ""; $("entrar").disabled = true;
  try { await B.login($("email").value.trim(), $("senha").value); }
  catch { $("msgLogin").textContent = "E-mail ou senha incorretos."; }
  $("entrar").disabled = false;
};
$("senha").addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrar").click(); });
$("sair").onclick = () => B.logout();

async function iniciar() {
  if (!DEMO && FIREBASE_CONFIG.apiKey === "COLE_AQUI") {
    mostrar("login"); $("msgLogin").textContent = "Falta colar a configuração do Firebase no ponto.html."; $("entrar").disabled = true; return;
  }
  B = DEMO ? criarBackendDemo() : await criarBackendReal();
  $("demo").classList.toggle("oculto", !DEMO);
  B.onUser(async (u) => {
    usuario = u;
    if (!u) { perfil = null; mostrar("login"); $("quem").textContent = ""; return; }
    try {
      perfil = await B.perfil(u.uid);
      if (!perfil || perfil.status !== "aprovado") { await B.logout(); mostrar("login"); $("msgLogin").textContent = "Seu acesso ainda não foi aprovado no AGI ERP."; return; }
      escritorio = await B.config().catch(() => null);
      $("quem").textContent = perfil.nome || u.email;
      $("admin").classList.toggle("oculto", perfil.area !== "TI");
      mostrar("ponto"); await carregar();
    } catch { mostrar("login"); $("msgLogin").textContent = "Não consegui carregar seus dados. Tente de novo."; }
  });
}
window.__ponto = { avaliarLocal, distanciaM, get backend() { return B; } };
iniciar();
</script>
